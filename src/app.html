<?marker name="/style/layout-overrides">
<?marker name="/style/chat-overrides">
<?marker name="/style/chat-color-overrides">
<?marker name="/style/prompt-box-overrides">
<?marker name="/layout/before">

<div class="layout">
	<?marker name="/chat/before">
	<div class="chat">
		<?marker name="/chat/append-message">
	</div>
	<?marker name="/chat/after">
    <?start name="/chat/prompt-box">
        <div class="prompt">
            <form method="post" action="CHAT_ID/prompt" target="hidden-submit-frame">
                <input hidden name="clientId" value="CLIENT_ID" />
                <div class="textarea-shell">
                    <?start name="/chat/prompt"><textarea name="prompt"></textarea><?end>
                </div>
                <button type="submit">Send</button>
            </form>
        </div>
	<?end>
</div>

<iframe name="hidden-submit-frame" hidden></iframe>
